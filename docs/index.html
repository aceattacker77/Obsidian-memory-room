<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Memory Room Demo</title>
<meta name="description" content="Try Memory Room, the cozy 3D memory palace for Obsidian, in your browser with a sample vault.">
<style>
.memory-room-view {
  padding: 0 !important;
  overflow: hidden;
}

.memory-room {
  --mr-panel: rgba(42, 30, 50, 0.86);
  --mr-panel-border: rgba(255, 255, 255, 0.1);
  --mr-text: #f6ede4;
  --mr-muted: #cdbfcf;
  --mr-accent: #e0a83a;
  position: relative;
  width: 100%;
  height: 100%;
  min-height: 420px;
  color: var(--mr-text);
  font-family: var(--font-interface, system-ui, sans-serif);
  user-select: none;
}

.mr-stage {
  position: absolute;
  inset: 0;
}

.memory-room-canvas {
  width: 100%;
  height: 100%;
  display: block;
  cursor: grab;
  touch-action: none;
}

.mr-topbar {
  position: absolute;
  top: 10px;
  left: 10px;
  right: 10px;
  display: flex;
  gap: 6px;
  overflow-x: auto;
  padding: 6px;
  border-radius: 14px;
  background: var(--mr-panel);
  border: 1px solid var(--mr-panel-border);
  backdrop-filter: blur(6px);
  scrollbar-width: thin;
}

.mr-spot {
  display: flex;
  align-items: center;
  gap: 6px;
  flex: 0 0 auto;
  padding: 5px 10px 5px 6px !important;
  border-radius: 10px !important;
  background: rgba(255, 255, 255, 0.06) !important;
  color: var(--mr-text) !important;
  border: none !important;
  box-shadow: none !important;
  font-size: 12px;
  cursor: pointer;
  height: auto !important;
}

.mr-spot:hover {
  background: rgba(255, 255, 255, 0.16) !important;
}

.mr-walk {
  display: inline-grid;
  place-items: center;
  min-width: 20px;
  height: 20px;
  border-radius: 6px;
  background: var(--mr-accent);
  color: #2a1e32;
  font-size: 11px;
  font-weight: 700;
}

.mr-count {
  font-size: 11px;
  color: var(--mr-muted);
}

.mr-rail {
  position: absolute;
  left: 10px;
  top: 74px;
  display: flex;
  flex-direction: column;
  gap: 6px;
  padding: 8px;
  border-radius: 14px;
  background: var(--mr-panel);
  border: 1px solid var(--mr-panel-border);
  width: 120px;
}

.mr-btn {
  background: rgba(255, 255, 255, 0.08) !important;
  color: var(--mr-text) !important;
  border: 1px solid rgba(255, 255, 255, 0.08) !important;
  box-shadow: none !important;
  border-radius: 9px !important;
  padding: 6px 10px !important;
  font-size: 13px;
  cursor: pointer;
  height: auto !important;
  text-align: left;
}

.mr-btn:hover {
  background: rgba(255, 255, 255, 0.18) !important;
}

.mr-primary {
  background: var(--mr-accent) !important;
  color: #2a1e32 !important;
  font-weight: 600;
  margin-top: 10px;
}

/* The light dropdown: text centred like the buttons above it. Obsidian's dropdown style
   pads the right for its arrow, so even the padding out. */
.mr-rail select.mr-mood {
  text-align: center;
  text-align-last: center;
  padding-left: 22px;
  padding-right: 22px;
  background-position: right 6px center;
}

.mr-mood option {
  color: #222;
}

.mr-panel {
  position: absolute;
  right: 10px;
  top: 74px;
  max-height: calc(100% - 84px);
  width: min(320px, 40%);
  display: none;
  flex-direction: column;
  gap: 8px;
  padding: 14px;
  border-radius: 14px;
  background: var(--mr-panel);
  border: 1px solid var(--mr-panel-border);
  overflow-y: auto;
  user-select: text;
}

.mr-panel.is-open {
  display: flex;
}

.mr-head {
  display: flex;
  align-items: center;
  gap: 8px;
}

.mr-title {
  font-size: 18px;
  font-weight: 700;
  line-height: 1.25;
}

.mr-sub {
  font-size: 12px;
  color: var(--mr-muted);
  word-break: break-word;
}

.mr-list {
  display: flex;
  flex-direction: column;
  gap: 4px;
}

.mr-item {
  padding: 7px 9px;
  border-radius: 9px;
  background: rgba(255, 255, 255, 0.06);
  cursor: pointer;
}

.mr-item:hover {
  background: rgba(255, 255, 255, 0.16);
}

.mr-item.is-faded {
  opacity: 0.6;
}

.mr-item-title {
  font-size: 13px;
  font-weight: 600;
}

.mr-item-meta {
  font-size: 11px;
  color: var(--mr-muted);
}

.mr-nav {
  display: flex;
  gap: 6px;
  margin-top: auto;
  padding-top: 8px;
}

.mr-nav .mr-btn {
  flex: 1;
  text-align: center;
}

.mr-back {
  align-self: flex-start;
}

.mr-preview {
  font-size: 13px;
  line-height: 1.5;
  white-space: pre-wrap;
  color: var(--mr-text);
  max-height: 50vh;
  overflow-y: auto;
}

.mr-search {
  width: 100%;
  padding: 7px 10px;
  border-radius: 9px;
  border: 1px solid rgba(255, 255, 255, 0.2);
  background: rgba(0, 0, 0, 0.25);
  color: var(--mr-text);
}

.mr-tooltip {
  position: absolute;
  pointer-events: none;
  padding: 4px 8px;
  border-radius: 7px;
  background: rgba(20, 14, 26, 0.9);
  color: var(--mr-text);
  font-size: 12px;
  opacity: 0;
  transition: opacity 0.1s;
  white-space: nowrap;
}

.mr-tooltip.is-visible {
  opacity: 1;
}

@media (max-width: 640px) {
  .mr-rail {
    top: auto;
    bottom: 10px;
    left: auto;
    right: 10px;
    flex-direction: row;
    width: auto;
  }
  .mr-panel {
    top: auto;
    bottom: 10px;
    left: 10px;
    width: auto;
    max-height: 45%;
  }
}

/* Narrow panes (a split or the sidebar): numbers only on the spot bar, rail in a row at the bottom,
   panel along the bottom so it doesn't cover the room. */
.memory-room {
  container-type: size;
  container-name: memory-room;
}

@container memory-room (max-width: 760px) {
  .mr-spot .mr-label,
  .mr-spot .mr-count {
    display: none;
  }
  .mr-spot {
    padding: 4px !important;
  }
  .mr-rail {
    top: auto;
    bottom: 10px;
    left: auto;
    right: 10px;
    flex-direction: row;
    width: auto;
  }
  .mr-panel {
    top: auto;
    left: 10px;
    bottom: 128px;
    width: auto;
    max-height: 42%;
  }
}

.mr-preview.markdown-rendered {
  white-space: normal;
  font-size: 13px;
}

.mr-preview.markdown-rendered > :first-child {
  margin-top: 0;
}

.memory-room-rules {
  width: 100%;
  font-family: var(--font-monospace);
}

.mr-music {
  display: flex;
  flex-direction: column;
  gap: 8px;
  padding: 10px;
  border-radius: 12px;
  background: rgba(255, 255, 255, 0.06);
}

.mr-music-controls {
  display: flex;
  gap: 6px;
}

.mr-music-controls .mr-btn {
  flex: 1;
  text-align: center;
  font-size: 15px;
}

.mr-music-play {
  background: var(--mr-accent) !important;
  color: #2a1e32 !important;
}

.mr-music-seek {
  display: flex;
  align-items: center;
  gap: 8px;
}

.mr-music-range {
  flex: 1;
  accent-color: var(--mr-accent);
}

.mr-tracks {
  max-height: 32vh;
  overflow-y: auto;
}

.mr-track.is-playing {
  background: rgba(224, 168, 58, 0.28);
}

.mr-music-mute {
  flex: 0 0 auto;
  padding: 4px 8px !important;
}

.mr-music-pct {
  min-width: 42px;
  text-align: right;
}

.mr-music-folder {
  display: flex;
  align-items: center;
  gap: 8px;
}

.mr-music-folder .mr-item-meta {
  flex: 1;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.mr-music-folder .mr-btn {
  flex: 0 0 auto;
  font-size: 12px;
}

/* Bottom-left pad for moving, turning and tilting the view. */
.mr-pad {
  position: absolute;
  left: 10px;
  bottom: 10px;
  display: flex;
  gap: 8px;
  padding: 8px;
  border-radius: 14px;
  background: var(--mr-panel);
  border: 1px solid var(--mr-panel-border);
  user-select: none;
  touch-action: none;
}
.mr-pad-title {
  font-size: 10px;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: var(--mr-muted);
  text-align: center;
  margin-bottom: 4px;
}
.mr-pad-grid {
  display: grid;
  grid-template-columns: repeat(3, 30px);
  grid-template-rows: repeat(3, 30px);
  grid-template-areas: ". u tr" "l c r" ". d br";
  gap: 3px;
}
.mr-pad-btn {
  width: 30px;
  height: 30px;
  padding: 0;
  font-size: 13px;
  line-height: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 8px;
  cursor: pointer;
}

/* Phones: Obsidian's floating navigation bar and the system bar sit over the bottom of the pane
   (about 95px on an Android phone, and env() reports nothing there), so the controls keep a fixed
   gap above them, stacked rail then pad. The notes panel goes to the top under the spot bar, so
   nothing stacks on the pad and the room stays visible in the middle. */
body.is-phone .memory-room {
  --mr-bottom: calc(max(env(safe-area-inset-bottom, 0px), 0px) + 112px);
}
body.is-phone .memory-room .mr-rail {
  bottom: var(--mr-bottom);
  left: 10px;
  right: 10px;
  justify-content: center;
}
body.is-phone .memory-room .mr-pad {
  bottom: calc(var(--mr-bottom) + 58px);
  left: 10px;
  right: 10px;
  justify-content: center;
}
body.is-phone .memory-room .mr-panel {
  top: 72px;
  bottom: auto;
  left: 10px;
  right: 10px;
  width: auto;
  max-height: 30%;
  overflow-y: auto;
  padding-right: 40px;
}
body.is-phone .memory-room .mr-panel[data-view="idle"] .mr-sub {
  display: none;
}

/* The close button sits in the panel's top right corner, clear of the title. */
.mr-close {
  position: absolute;
  top: 6px;
  right: 6px;
  width: 30px;
  height: 30px;
  padding: 0;
  border: none;
  border-radius: 50%;
  background: rgba(255, 255, 255, 0.08);
  color: var(--mr-text);
  font-size: 14px;
  line-height: 1;
  cursor: pointer;
}

.mr-close:hover {
  background: rgba(255, 255, 255, 0.18);
}

/* Phones: the pane is narrow enough to hit the numbers-only rule above, but a phone has no hover
   to fall back on, so the spot names stay and the bar scrolls sideways. */
body.is-phone .memory-room .mr-spot .mr-label {
  display: inline;
}
body.is-phone .memory-room .mr-spot {
  padding: 5px 10px 5px 6px !important;
}
body.is-phone .memory-room .mr-spot.is-active {
  background: var(--mr-accent) !important;
  color: #2a1e32 !important;
}

</style>
<style>
:root {
  --demo-bg: #1d1524;
  --demo-bar: #2a1e32;
  --demo-text: #f6ede4;
  --demo-muted: #cdbfcf;
  --demo-accent: #e0a83a;
  --demo-card: #fbf6f0;
  --demo-card-text: #2a1e32;
  --demo-card-muted: #6d5e70;
  --demo-link: #8a4fb0;
  --font-interface: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --demo-card: #2f2338;
    --demo-card-text: #f6ede4;
    --demo-card-muted: #cdbfcf;
    --demo-link: #f0c060;
  }
}
:root[data-theme="dark"] {
  --demo-card: #2f2338;
  --demo-card-text: #f6ede4;
  --demo-card-muted: #cdbfcf;
  --demo-link: #f0c060;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; overflow: hidden; }
body {
  background: var(--demo-bg);
  color: var(--demo-text);
  font-family: var(--font-interface);
  display: flex;
  flex-direction: column;
  height: 100%;
}
.demo-bar {
  flex: none;
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 7px 14px;
  background: var(--demo-bar);
  border-bottom: 1px solid rgba(255, 255, 255, 0.08);
  font-size: 13px;
  line-height: 1.3;
}
.demo-by { color: var(--demo-muted); }
.demo-bar b { color: var(--demo-accent); font-weight: 600; }
.demo-bar .demo-pill {
  font-size: 11px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase;
  padding: 2px 7px; border-radius: 999px; background: var(--demo-accent); color: #2a1e32;
}
.demo-bar .demo-note { color: var(--demo-muted); flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.demo-bar a {
  color: var(--demo-text); text-decoration: none; white-space: nowrap;
  padding: 4px 10px; border-radius: 6px; border: 1px solid rgba(255, 255, 255, 0.18);
}
.demo-bar a:hover { background: rgba(255, 255, 255, 0.08); }
#room { flex: 1; min-height: 0; position: relative; }
#room > .memory-room { position: absolute; inset: 0; min-height: 0; }
.demo-loading {
  position: absolute; inset: 0; display: grid; place-items: center; color: var(--demo-muted); font-size: 14px;
  pointer-events: none;
}

/* A browser has no Obsidian nav bar to keep clear of, only the system's safe area. */
body.is-phone .memory-room { --mr-bottom: calc(env(safe-area-inset-bottom, 0px) + 10px); }
body.is-phone .demo-bar .demo-note { display: none; }
body.is-phone .demo-bar { padding: 6px 10px; font-size: 12px; }
body.is-phone .memory-room .mr-panel { top: 62px; max-height: 34%; }

/* The note reader: what "Open note" does in the demo. */
.demo-reader {
  position: fixed; inset: 0; z-index: 50; background: rgba(10, 6, 14, 0.55);
  display: grid; place-items: center; padding: 16px;
}
.demo-reader-card {
  width: min(620px, 100%); max-height: min(80dvh, 720px); display: flex; flex-direction: column;
  background: var(--demo-card); color: var(--demo-card-text); border-radius: 12px; overflow: hidden;
  box-shadow: 0 20px 60px rgba(0, 0, 0, 0.45);
}
.demo-reader-bar {
  display: flex; align-items: center; gap: 8px; padding: 10px 12px 10px 18px;
  border-bottom: 1px solid rgba(127, 127, 127, 0.2); font-size: 12px; color: var(--demo-card-muted);
}
.demo-reader-path { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-family: ui-monospace, monospace; }
.demo-reader-close {
  width: 30px; height: 30px; border-radius: 50%; border: none; cursor: pointer;
  background: rgba(127, 127, 127, 0.15); color: var(--demo-card-text);
}
.demo-reader-body { padding: 4px 22px 18px; overflow-y: auto; font-size: 15px; line-height: 1.6; }
.demo-reader-body h1 { font-size: 24px; margin: 14px 0 8px; }
.demo-reader-body h2 { font-size: 17px; margin: 16px 0 4px; }
.demo-reader-body a, .mr-preview a { color: var(--demo-link); }
.demo-reader-foot { padding: 10px 18px; font-size: 12px; color: var(--demo-card-muted); border-top: 1px solid rgba(127, 127, 127, 0.2); }
.mr-preview a { color: var(--demo-accent); }
.task-list-item { list-style: none; margin-left: -1.3em; }
.task-list-item input { margin-right: 4px; }
.is-unresolved { opacity: 0.7; }

.demo-toast {
  position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); z-index: 60;
  background: var(--demo-bar); color: var(--demo-text); border: 1px solid rgba(255, 255, 255, 0.15);
  padding: 10px 16px; border-radius: 8px; font-size: 13px; max-width: calc(100% - 32px);
  transition: opacity 0.5s;
}
.demo-toast.is-gone { opacity: 0; }
</style>

<body>
<div class="demo-bar">
  <span class="demo-pill">Demo</span>
  <span><b>Memory Room</b> <span class="demo-by">by Ace Attacker</span></span>
  <span class="demo-note">Sample notes only, nothing leaves your browser. Drag to look around, click a spot, or press Walk.</span>
  <a href="https://github.com/aceattacker77/obsidian-memory-room" target="_blank" rel="noopener">Get it for Obsidian</a>
</div>
<div id="room"><div class="demo-loading">Setting up the room…</div></div>
<script>
// If the room can't start (no WebGL, an old browser), say so instead of leaving the page empty.
window.addEventListener("error", function (e) {
  var box = document.querySelector(".demo-loading");
  if (!box) return;
  var gl = /webgl/i.test(String(e.message));
  box.textContent = gl
    ? "This demo needs WebGL, which this browser has turned off. Try another browser, or turn on hardware acceleration."
    : "The room couldn't start in this browser (" + e.message + ").";
  box.style.padding = "0 24px";
  box.style.textAlign = "center";
});
</script>

**Went well:** shipped the reading nook shelf, three morning walks, finished *The Left Hand of Darkness*.

**Didn't:** the sourdough starter died again.

**Next week**
- Book the dentist
- Draft the garden plan, see [[Grow tomatoes on the balcony]]
- Call Grandma on Sunday`},{path:"reviews/2026-W42 weekly review.md",age:9,body:`# Week 42 review

- Two paintings, both of the same teapot
- Sleep was good, 7h average`},{path:"reviews/2026-09 monthly review.md",age:38,body:`# September review

Theme of the month: *less phone, more paper.*

1. Read four books
2. Started the journal habit again
3. Moved the desk next to the window, best decision this year`},{path:"identity/USER.md",age:4,body:`# About me

I like quiet mornings, long walks and tidy desks. I keep this vault so I remember what matters.

## Values
- Be kind first
- Make things with my hands
- Leave places nicer than I found them

## Currently into
Watercolour, lo-fi music, slow cooking.`},{path:"open-questions.md",age:3,body:`# Open questions

- Should I learn Spanish or Japanese next?
- What would a four-day work week look like for me?
- Is a cat a good idea for a small flat? (DJ Whiskers says yes)`},{path:"missions/Walk 1000 km this year.md",age:1,body:`# Walk 1000 km this year

Progress: **742 km** so far.

- [x] January to June: 410 km
- [x] July to September: 260 km
- [ ] October to December: 258 km to go`},{path:"missions/Cook every recipe in the blue book.md",age:12,body:`# Cook every recipe in the blue book

31 of 64 done. Favourite so far: the miso aubergine.`},{path:"archive/2024 travel plans.md",age:400,body:`# 2024 travel plans

Lisbon in spring, the Lake District in autumn. Both happened, both were lovely.`},{path:"archive/Old flat move checklist.md",age:210,body:`# Moving checklist

- [x] Boxes from the corner shop
- [x] Change address everywhere
- [x] Say goodbye to the neighbour's dog`},{path:"archive/University notes index.md",age:900,body:`# University notes index

Kept for nostalgia. Mostly coffee stains.`},{path:"keep/Birdwatching from the window.md",age:2,body:`# Birdwatching from the window

Seen this month: robin, two blue tits, a very confused pigeon.

Next: put up the feeder.`},{path:"keep/Lo-fi music to study to.md",age:6,body:`# Lo-fi music to study to

Rainy-day beats, vinyl crackle, a cat on the keys. The music player in the room plays these.`},{path:"keep/Japanese woodblock prints.md",age:20,body:`# Japanese woodblock prints

Hokusai's waves, Hiroshige's rain. Would love one print for the hallway.`},{path:"projects/Reading nook/STATUS.md",age:1,body:`# Reading nook

**Status:** nearly done

- [x] Build the shelf
- [x] Find a beanbag
- [ ] Fairy lights above the window`},{path:"projects/Learn watercolour/STATUS.md",age:3,body:`# Learn watercolour

**Status:** practising

Twenty minutes every evening. Current lesson: wet-on-wet skies.`},{path:"projects/Grow tomatoes on the balcony/STATUS.md",age:8,body:`# Grow tomatoes on the balcony

**Status:** planning for spring

Varieties to try: Sungold, Gardener's Delight. Needs two big pots and a sunny corner.`},{path:"projects/Family recipe book/STATUS.md",age:15,body:`# Family recipe book

**Status:** collecting

Grandma's lemon cake, Dad's Sunday curry, Auntie May's dumplings.`},{path:"decisions/2026-10-02 switch to a paper planner.md",age:27,body:`# Switch to a paper planner

**Decision:** use a paper weekly planner and keep the vault for long notes.

**Why:** fewer notifications, and writing by hand helps me remember.`},{path:"decisions/2026-08-14 adopt a cat.md",age:76,body:`# Adopt a cat

**Decision:** yes, a rescue cat, once the flat inspection is done.

**Name ideas:** Miso, Pixel, DJ Whiskers (winner).`},{path:"decisions/2026-10-20 no screens after 10pm.md",age:4,body:`# No screens after 10pm

Trying it for a month. Books and tea instead.`},{path:"notes/How memory palaces work.md",age:2,body:`# How memory palaces work

The *method of loci*: put each thing you want to remember in a place you know well, then walk through it in your mind.

This room is one. Each spot holds one kind of memory, and **Walk** visits them in order.`},{path:"notes/Sourdough troubleshooting.md",age:5,body:`# Sourdough troubleshooting

- Flat loaf: starter not active enough
- Gummy crumb: cut it too early
- Starter died: probably forgot it for two weeks (again)`},{path:"notes/Book list 2026.md",age:7,body:`# Book list 2026

1. *The Left Hand of Darkness*, Ursula K. Le Guin
2. *Piranesi*, Susanna Clarke
3. *A Psalm for the Wild-Built*, Becky Chambers
4. *Klara and the Sun*, Kazuo Ishiguro`},{path:"notes/Tea ratios.md",age:14,body:`# Tea ratios

- Green: 80\xB0C, 2 minutes
- Black: just off the boil, 4 minutes
- Chamomile: as long as you like`},{path:"notes/Houseplant watering.md",age:22,body:`# Houseplant watering

Monstera weekly, snake plant monthly, the cactus basically never.`},{path:"notes/Keyboard shortcuts I keep forgetting.md",age:40,body:`# Keyboard shortcuts I keep forgetting

In the room: **arrow keys** walk between spots, **Esc** steps back, **/** finds a memory.`},{path:"daily/2026-10-28.md",age:0,body:`# Tuesday

Morning walk by the canal, 6 km. Painted the teapot again. DJ Whiskers knocked a pen off the desk, twice.`},{path:"daily/2026-10-27.md",age:1,body:`# Monday

Rainy. Soup, a book and an early night.`},{path:"daily/2026-10-25.md",age:3,body:`# Saturday

Farmers' market: apples, sourdough (bought, not baked), a small cactus.`},{path:"daily/2026-10-19.md",age:9,body:`# Sunday

Called Grandma. She wants the lemon cake recipe back.`},{path:"people/Grandma.md",age:9,fm:{"room-spot":"photo_table"},body:`# Grandma

Makes the best lemon cake in the world. Call on Sundays.

Birthday: 3 March.`},{path:"people/Sam and Alex.md",age:18,fm:{"room-spot":"photo_table"},body:`# Sam and Alex

Neighbours upstairs. Board game night every other Friday.`},{path:"people/DJ Whiskers.md",age:0,fm:{"room-spot":"photo_table"},body:`# DJ Whiskers

The room's cat. Wanders about, eats from the dish, and dances when music plays.
